services:
  mysql:
    image: mysql:8.0
    container_name: servetrack-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - servetrack
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./servetrack-backend
      dockerfile: Dockerfile.prod
    container_name: servetrack-backend
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME}
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      APP_DEBUG: false
      APP_URL: ${APP_URL}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      CACHE_DRIVER: file
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: file
      ADMIN_INVITE_CODE: ${ADMIN_INVITE_CODE}
      ADMIN_ALLOWED_DOMAINS: ${ADMIN_ALLOWED_DOMAINS}
      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS}
      FRONTEND_URL: ${FRONTEND_URL}
    volumes:
      - backend_storage:/var/www/storage
    networks:
      - servetrack
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./servetrack-frontend
      dockerfile: Dockerfile.prod
      args:
        API_URL: ${APP_URL}
    container_name: servetrack-frontend
    restart: unless-stopped
    networks:
      - servetrack
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: servetrack-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
      - frontend_dist:/usr/share/nginx/html:ro
    networks:
      - servetrack
    depends_on:
      - frontend
      - backend

  certbot:
    image: certbot/certbot
    container_name: servetrack-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

networks:
  servetrack:
    driver: bridge

volumes:
  mysql_data:
  backend_storage:
  frontend_dist:

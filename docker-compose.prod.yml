version: '3.8'

services:
  # Nginx reverse proxy for frontend and API
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend_dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
    networks:
      - servetrack

  # Laravel backend (PHP-FPM)
  backend:
    build:
      context: ./servetrack-backend
      dockerfile: Dockerfile.prod
    env_file:
      - ./servetrack-backend/.env.docker
    volumes:
      - ./servetrack-backend/.env:/var/www/.env:ro
      - ./servetrack-backend/storage:/var/www/storage:rw
      - ./servetrack-backend/bootstrap/cache:/var/www/bootstrap/cache:rw
    depends_on:
      - mysql
    networks:
      - servetrack
    restart: unless-stopped

  # Angular frontend
  frontend:
    build:
      context: ./servetrack-frontend
      dockerfile: Dockerfile.prod
    volumes:
      - frontend_dist:/app/dist/browser:ro
    networks:
      - servetrack
    restart: unless-stopped

  # MySQL database
  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootsecret}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-servetrack}
      MYSQL_USER: ${MYSQL_USER:-servetrack}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-secret}
      MYSQL_INITDB_SKIP_TZINFO: 1
    networks:
      - servetrack
    restart: unless-stopped

  # Migration service (runs once on deploy)
  migrate:
    image: backend
    command: php artisan migrate --force
    env_file:
      - ./servetrack-backend/.env.docker
    depends_on:
      - mysql
    networks:
      - servetrack
    restart: "no"

volumes:
  mysql_data:
  frontend_dist:

networks:
  servetrack:
    driver: bridge
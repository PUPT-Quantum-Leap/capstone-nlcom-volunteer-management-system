<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="girlBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#db2777" />
      <stop offset="100%" stop-color="#701a75" />
    </linearGradient>
    <!-- Skin Gradient -->
    <linearGradient id="gSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff5f5" />
      <stop offset="100%" stop-color="#ffd1d3" />
    </linearGradient>
    <!-- Hair Gradient -->
    <linearGradient id="gHair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d1a47" />
      <stop offset="100%" stop-color="#12051c" />
    </linearGradient>
    <!-- Clothing Gradient -->
    <linearGradient id="gClothes" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#9f1239" />
    </linearGradient>
    <!-- Shadow Filter -->
    <filter id="gSoftShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Circle Base -->
  <circle cx="50" cy="50" r="50" fill="url(#girlBg)" />

  <!-- Back Hair (falling behind shoulders) -->
  <path d="M28 45 C20 55, 18 80, 26 88 C32 80, 36 68, 50 68 C64 68, 68 80, 74 88 C82 80, 80 55, 72 45 Z" fill="url(#gHair)" />

  <!-- Body / Blouse -->
  <path d="M22 90 C22 75, 32 70, 40 70 L60 70 C68 70, 78 75, 78 90 Z" fill="url(#gClothes)" filter="url(#gSoftShadow)" />
  <path d="M42 70 L50 81 L58 70 Z" fill="#881337" /> <!-- Inner neckline -->
  
  <!-- Tiny gold necklace -->
  <path d="M44 65 Q50 69 56 65" stroke="#fbbf24" stroke-width="1.2" fill="none" />
  <circle cx="50" cy="67.5" r="2" fill="#fbbf24" />

  <!-- Neck -->
  <path d="M44 56 L44 71 C44 74, 56 74, 56 71 L56 56 Z" fill="#ffd1d3" />
  <path d="M44 56 L56 56 C56 56, 50 63, 44 56" fill="#fca5a5" opacity="0.6" /> <!-- Neck shadow -->

  <!-- Ears & Pearl Earrings -->
  <circle cx="32.5" cy="46.5" r="4" fill="#ffd1d3" />
  <circle cx="67.5" cy="46.5" r="4" fill="#ffd1d3" />
  <circle cx="32.5" cy="49" r="1.5" fill="#ffffff" />
  <circle cx="67.5" cy="49" r="1.5" fill="#ffffff" />

  <!-- Head / Face -->
  <path d="M34 46 C34 32, 66 32, 66 46 C66 58, 61 61, 50 61 C39 61, 34 58, 34 46 Z" fill="url(#gSkin)" />

  <!-- Eyes with gorgeous long eyelashes -->
  <g fill="#12051c">
    <circle cx="43" cy="45.5" r="2.5" />
    <circle cx="57" cy="45.5" r="2.5" />
  </g>
  <!-- Eyelash curves -->
  <path d="M39.5 44 C41 42, 45 42, 46.5 44.5" stroke="#12051c" stroke-width="1.5" stroke-linecap="round" fill="none" />
  <path d="M60.5 44 C59 42, 55 42, 53.5 44.5" stroke="#12051c" stroke-width="1.5" stroke-linecap="round" fill="none" />
  <!-- Additional lash flick -->
  <path d="M39.5 44 Q38.5 42.5 37.5 43.5" stroke="#12051c" stroke-width="1.2" stroke-linecap="round" fill="none" />
  <path d="M60.5 44 Q61.5 42.5 62.5 43.5" stroke="#12051c" stroke-width="1.2" stroke-linecap="round" fill="none" />

  <!-- Eye Reflections -->
  <g fill="#ffffff">
    <circle cx="42.2" cy="44.7" r="0.8" />
    <circle cx="56.2" cy="44.7" r="0.8" />
    <circle cx="43.8" cy="46.3" r="0.4" />
    <circle cx="57.8" cy="46.3" r="0.4" />
  </g>

  <!-- Eyebrows -->
  <path d="M39 39.5 C41 38, 44.5 38.5 46.5 40" stroke="#2d1a47" stroke-width="1.5" stroke-linecap="round" fill="none" />
  <path d="M61 39.5 C59 38, 55.5 38.5 53.5 40" stroke="#2d1a47" stroke-width="1.5" stroke-linecap="round" fill="none" />

  <!-- Nose -->
  <path d="M49 47.2 C49 49.2, 50 49.7, 51 49.2" stroke="#fda4af" stroke-width="1.5" stroke-linecap="round" fill="none" />

  <!-- Cute lips -->
  <path d="M44 53.5 Q50 58 56 53.5" stroke="#be123c" stroke-width="2" stroke-linecap="round" fill="none" />
  <!-- Soft blushing cheeks -->
  <circle cx="37" cy="51.5" r="3.5" fill="#f43f5e" opacity="0.25" />
  <circle cx="63" cy="51.5" r="3.5" fill="#f43f5e" opacity="0.25" />

  <!-- Front Hair -->
  <path d="M33 42 C33 30, 67 30, 67 42 C67 36, 61 31, 50 31 C39 31, 33 35, 33 42 Z" fill="url(#gHair)" />
  <!-- Side strands framing the cheeks -->
  <path d="M33 40 C32 46, 33 53, 36 57 C35.2 49, 35 43, 35 40 Z" fill="url(#gHair)" />
  <path d="M67 40 C68 46, 67 53, 64 57 C64.8 49, 65 43, 65 40 Z" fill="url(#gHair)" />
  <!-- Side-swept fringe details -->
  <path d="M34 35 C42 27, 48 30, 52 35 C44 32, 38 34, 34 38 Z" fill="url(#gHair)" opacity="0.95" />
  <path d="M66 35 C58 27, 52 30, 48 35 C56 32, 62 34, 66 38 Z" fill="url(#gHair)" opacity="0.95" />
</svg>

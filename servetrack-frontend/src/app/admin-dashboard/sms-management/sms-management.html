<section class="sms-management-container">
  <!-- Blue Header Bar -->
  <header class="report-header">
    <div class="report-header-left">
      <div class="report-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
          <polyline points="22,6 12,13 2,6"/>
        </svg>
      </div>
      <div class="report-title-group">
        <span class="report-label">EMAIL NOTIFICATIONS</span>
        <h2 class="report-title">Prepare Messages & Broadcasts</h2>
      </div>
    </div>
  </header>

  <!-- Status Banner -->
  @if (feedbackMessage()) {
    <div class="status-banner" [class.success]="feedbackType() === 'success'" [class.error]="feedbackType() === 'error'">
      {{ feedbackMessage() }}
    </div>
  }

  <section class="sms-layout">
    <article class="sms-panel sms-panel-compose">
      <header class="sms-panel-header">
        <div class="panel-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
            <polyline points="22,6 12,13 2,6"/>
          </svg>
        </div>
        <div>
          <h3>Compose Message</h3>
          <p>Create and queue email broadcasts</p>
        </div>
      </header>

      <div class="compose-form">
        <div class="form-row">
          <div class="form-group">
            <label for="sms-audience">Audience</label>
            <select #audienceSelect id="sms-audience" class="form-input" [value]="smsAudience()"
              (change)="setSmsAudience($any(audienceSelect.value))">
              <option value="all">All Volunteers</option>
              <option value="voted">Voted</option>
              <option value="not_voted">Not Voted</option>
            </select>
          </div>

          <div class="form-group">
            <label for="sms-template">Template</label>
            <select #templateSelect id="sms-template" class="form-input" [value]="selectedSmsTemplate()"
              (change)="applySmsTemplate(templateSelect.value)">
              <option value="">Start from scratch</option>
              @for (template of smsTemplates; track template.name) {
                <option [value]="template.message">{{ template.name }}</option>
              }
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="sms-message">Message</label>
          <textarea #messageInput id="sms-message" class="form-textarea sms-message-input" rows="5" [value]="smsMessage()"
            (input)="updateSmsMessage(messageInput.value)" placeholder="Type your broadcast message here..."></textarea>
          <div class="sms-footer-row">
            <span>Recipients: <strong>{{ smsRecipientsCount() }}</strong></span>
            <span>Characters: <strong>{{ smsCharacterCount() }}</strong></span>
          </div>
        </div>

        <div class="sms-actions">
          <button type="button" class="action-btn" [disabled]="smsSending()" (click)="sendSmsBroadcast()">
            @if (smsSending()) {
              <span class="btn-spinner"></span> Sending...
            } @else {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <line x1="22" y1="2" x2="11" y2="13"/>
                <polygon points="22 2 15 22 11 13 2 9 22 2"/>
              </svg>
              Queue Broadcast
            }
          </button>
        </div>
      </div>
    </article>
  </section>
</section>

<div class="not-found-container">
  <div class="not-found-content">
    <div class="error-illustration">
      <svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="100" cy="100" r="90" stroke="#dbeafe" stroke-width="4" />
        <path
          d="M70 80C70 75.5817 73.5817 72 78 72H92C96.4183 72 100 75.5817 100 80V94C100 98.4183 96.4183 102 92 102H78C73.5817 102 70 98.4183 70 94V80Z"
          fill="#1d4ed8"
        />
        <path
          d="M100 80C100 75.5817 103.582 72 108 72H122C126.418 72 130 75.5817 130 80V94C130 98.4183 126.418 102 122 102H108C103.582 102 100 98.4183 100 94V80Z"
          fill="#1d4ed8"
        />
        <path
          d="M60 130C60 125 80 120 100 120C120 120 140 125 140 130"
          stroke="#1d4ed8"
          stroke-width="4"
          stroke-linecap="round"
        />
      </svg>
    </div>

    <div class="error-code">404</div>

    <h1 class="error-title">Page Not Found</h1>
    <p class="error-message">Oops! The page you're looking for doesn't exist or has been moved.</p>

    <div class="error-actions">
      <button type="button" class="primary-btn" (click)="goHome()">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none">
          <path
            d="M3 9L12 2L21 9V20C21 20.5304 20.7893 21.0391 20.4142 21.4142C20.0391 21.7893 19.5304 22 19 22H5C4.46957 22 3.96086 21.7893 3.58579 21.4142C3.21071 21.0391 3 20.5304 3 20V9Z"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path
            d="M9 22V12H15V22"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        Go to Home
      </button>
      <button type="button" class="secondary-btn" (click)="goBack()">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none">
          <path
            d="M19 12H5M5 12L12 19M5 12L12 5"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        Go Back
      </button>
    </div>

    <div class="help-text">
      <p>Need help? Contact our support team or visit our help center.</p>
    </div>
  </div>
</div>

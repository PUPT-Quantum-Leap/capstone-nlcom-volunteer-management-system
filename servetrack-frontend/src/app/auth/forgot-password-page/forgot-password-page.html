<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <div class="logo">
        <img
          ngSrc="/assets/nlcom.png"
          width="60"
          height="60"
          alt="NLCOM Logo"
          class="logo-image"
          priority
        />
        <span class="logo-text">ServeTrack</span>
      </div>
      <h1 class="auth-title">Forgot Password</h1>
      <p class="auth-subtitle">Enter your email to receive a reset link</p>
    </div>

    @if (error()) {
      <div class="alert alert-error" role="alert">
        {{ error() }}
      </div>
    }

    @if (isSuccess()) {
      <div class="alert alert-success" role="alert">
        <svg class="alert-icon" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" />
        </svg>
        If this email is registered, you will receive a password reset link.
      </div>
    }

    @if (!isSuccess()) {
      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="auth-form" novalidate>
        <div class="form-group">
          <label for="email" class="form-label">Email Address</label>
          <input
            id="email"
            type="email"
            formControlName="email"
            class="form-input"
            [class.error]="emailControl?.touched && emailControl?.invalid"
            placeholder="admin@example.com"
            autocomplete="email"
            autofocus
          />
          @if (getFieldError()) {
            <span class="error-text">{{ getFieldError() }}</span>
          }
        </div>

        <button
          type="submit"
          class="btn btn-primary btn-full"
          [disabled]="isLoading()"
        >
          @if (isLoading()) {
            <span class="loading-spinner" aria-hidden="true"></span>
          }
          {{ isLoading() ? 'Sending...' : 'Send Reset Link' }}
        </button>
      </form>
    }

    <p class="switch-hint">
      <a routerLink="/admin-auth" class="link-primary">Back to Sign In</a>
    </p>
  </div>
</div>

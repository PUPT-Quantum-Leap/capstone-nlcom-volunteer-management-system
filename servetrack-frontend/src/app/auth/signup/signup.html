<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <div class="logo">
        <img src="/assets/nlcom.png" alt="NLCOM Logo" class="logo-image">
        <span class="logo-text">ServeTrack</span>
      </div>
      <h1 class="auth-title">Join ServeTrack</h1>
      <p class="auth-subtitle">Create your account to start volunteering</p>
    </div>

    <form class="auth-form" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="name" class="form-label">Full Name</label>
        <input
          type="text"
          id="name"
          [(ngModel)]="name"
          name="name"
          class="form-input"
          placeholder="Enter your full name"
          required
        >
      </div>

      <div class="form-group">
        <label for="email" class="form-label">Email Address</label>
        <input
          type="email"
          id="email"
          [(ngModel)]="email"
          name="email"
          class="form-input"
          placeholder="Enter your email"
          required
        >
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input
          type="password"
          id="password"
          [(ngModel)]="password"
          name="password"
          class="form-input"
          placeholder="Create a password"
          required
        >
      </div>

      <div class="form-group">
        <label for="confirmPassword" class="form-label">Confirm Password</label>
        <input
          type="password"
          id="confirmPassword"
          [(ngModel)]="confirmPassword"
          name="confirmPassword"
          class="form-input"
          placeholder="Confirm your password"
          required
        >
      </div>

      <div class="form-options">
        <label class="checkbox-container">
          <input type="checkbox" class="checkbox-input" required>
          <span class="checkmark"></span>
          I agree to the <a href="#" class="link"> Terms of Service</a> and <a href="#" class="link"> Privacy Policy </a>
        </label>
      </div>

      <button
        type="submit"
        class="btn btn-primary btn-full"
        [disabled]="isLoading"
      >
        <span *ngIf="isLoading" class="loading-spinner"></span>
        {{ isLoading ? 'Creating Account...' : 'Create Account' }}
      </button>
    </form>

    <div class="auth-footer">
      <p class="auth-footer-text">
        Already have an account?
        <a href="#" class="auth-link" (click)="navigateToLogin()">Sign in</a>
      </p>
    </div>
  </div>
</div>

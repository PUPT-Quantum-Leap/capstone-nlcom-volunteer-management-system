@if (isAuthenticated()) {
  <div class="user-bar-content">
    <span class="signed-in-label hidden md:inline">Signed in as</span>

    <button (click)="toggleDropdown()" class="user-badge-btn">
      <!-- Profile Photo -->
      <img
        [src]="getProfilePhotoUrl()"
        [alt]="getUserName()"
        [class.admin-bg]="isAdminUser()"
        [class.p-1]="isSvgImage()"
        [class.object-cover]="!isSvgImage()"
        class="flex-shrink-0"
      />

      <!-- Name & Role -->
      <div class="user-info hidden md:flex">
        <span class="user-name">
          {{ getUserName() }}
        </span>
        <span class="user-role" [class]="getRoleColorClass()">
          {{ getUserRole() }}
        </span>
      </div>

      <!-- Chevron Icon -->
      <svg
        class="chevron-icon"
        [class.rotate-180]="isDropdownOpen()"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
      >
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
      </svg>
    </button>

    <!-- Dropdown Menu -->
    @if (isDropdownOpen()) {
      <!-- Backdrop -->
      <div (click)="closeDropdown()" class="fixed inset-0 z-40 cursor-default"></div>

      <!-- Dropdown Content -->
      <div class="user-dropdown">
        <!-- User Info Header -->
        <div class="dropdown-header">
          <ng-icon name="heroUser" class="icon-md"></ng-icon>
          <div>
            <span class="name">{{ getUserName() }}</span>
            <span class="email">{{ getUserEmail() }}</span>
          </div>
        </div>

        <!-- Menu Items -->
        <button (click)="switchAccount()" class="dropdown-item">
          <ng-icon name="heroArrowsRightLeft" class="icon-sm"></ng-icon>
          Switch Account
        </button>

        <button (click)="logout()" class="dropdown-item logout-item">
          <ng-icon name="heroArrowRightOnRectangle" class="icon-sm"></ng-icon>
          Sign Out
        </button>
      </div>
    }
  </div>
}

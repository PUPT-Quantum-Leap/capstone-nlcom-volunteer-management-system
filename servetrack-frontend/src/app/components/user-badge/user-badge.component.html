<div class="user-bar-content">
  @if (isAuthenticated()) {
    <span class="signed-in-label hidden md:inline">Signed in as</span>

    @if (readonly()) {
      <div class="user-badge-btn readonly">
        <img
          [src]="getProfilePhotoUrl()"
          [alt]="getUserName()"
          [class.admin-bg]="isAdminUser()"
          [class.p-1]="isSvgImage()"
          [class.object-cover]="!isSvgImage()"
          class="flex-shrink-0"
        />
        <div class="user-info hidden md:flex">
          <span class="user-name">{{ getUserName() }}</span>
          <span class="user-role" [class]="getRoleColorClass()">{{ getUserRole() }}</span>
        </div>
      </div>
    } @else {
    <button
      (click)="toggleDropdown()"
      (keydown)="handleDropdownKeydown($event)"
      class="user-badge-btn"
      [attr.aria-expanded]="isDropdownOpen()"
      aria-haspopup="true"
      aria-label="User menu, press enter to open options"
    >
      <!-- Profile Photo -->
      <img
        [src]="getProfilePhotoUrl()"
        [alt]="getUserName()"
        [class.admin-bg]="isAdminUser()"
        [class.p-1]="isSvgImage()"
        [class.object-cover]="!isSvgImage()"
        class="flex-shrink-0"
      />

      <!-- Name & Role -->
      <div class="user-info hidden md:flex">
        <span class="user-name">
          {{ getUserName() }}
        </span>
        <span class="user-role" [class]="getRoleColorClass()">
          {{ getUserRole() }}
        </span>
      </div>

      <!-- Chevron Icon -->
      <svg
        class="chevron-icon"
        [class.rotate-180]="isDropdownOpen()"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
        aria-hidden="true"
      >
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
      </svg>
    </button>
    }

    <!-- Dropdown Menu -->
    @if (!readonly() && isDropdownOpen()) {
      <!-- Backdrop -->
      <div
        (click)="closeDropdown()"
        (keydown.escape)="closeDropdown()"
        class="fixed inset-0 z-40 cursor-default"
        aria-hidden="true"
      ></div>

      <!-- Dropdown Content -->
      <div
        class="user-dropdown"
        role="menu"
        aria-label="User options"
        (keydown)="handleDropdownMenuKeydown($event)"
      >
        <!-- User Info Header -->
        <div class="dropdown-header" role="none">
          <ng-icon name="heroUser" class="icon-md" aria-hidden="true"></ng-icon>
          <div>
            <span class="name">{{ getUserName() }}</span>
            <span class="email">{{ getUserEmail() }}</span>
          </div>
        </div>

        <!-- Menu Items -->
        <button (click)="switchAccount()" class="dropdown-item" role="menuitem">
          <ng-icon name="heroArrowsRightLeft" class="icon-sm" aria-hidden="true"></ng-icon>
          Switch Account
        </button>

        <button (click)="logout()" class="dropdown-item logout-item" role="menuitem">
          <ng-icon name="heroArrowRightOnRectangle" class="icon-sm" aria-hidden="true"></ng-icon>
          Sign Out
        </button>
      </div>
    }
  } @else {
    <div class="guest-badge">
      <div class="guest-info">
        <div class="guest-avatar" aria-hidden="true">
          <ng-icon name="heroUser"></ng-icon>
        </div>
        <span class="guest-text hidden sm:inline">Guest Mode</span>
      </div>
      <button (click)="redirectToLogin()" class="login-btn">
        Sign In
      </button>
    </div>
  }
</div>

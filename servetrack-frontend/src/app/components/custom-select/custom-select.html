<div class="custom-select-container" [class.open]="isOpen()" [class.variant-admin]="variant() === 'admin'" [class.variant-volunteer]="variant() === 'volunteer'">
  <button type="button" class="select-trigger" 
    [class.status-present]="status() === 'present'"
    [class.status-absent]="status() === 'absent'"
    (click)="toggleDropdown()">
    <span class="selected-label">{{ selectedOption()?.label || placeholder }}</span>
    <svg class="chevron-icon" [class.open]="isOpen()" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7" />
    </svg>
  </button>

  @if (isOpen()) {
    <div class="options-menu">
      @for (option of options(); track option.value) {
        <button 
          type="button" 
          class="option-item" 
          [class.selected]="option.value === value()"
          (click)="selectOption(option)"
        >
          @if (option.icon) {
            <span class="option-icon" [innerHTML]="option.icon"></span>
          }
          <span class="option-label">{{ option.label }}</span>
          @if (option.value === value()) {
            <svg class="check-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" />
            </svg>
          }
        </button>
      }
    </div>
  }
</div>

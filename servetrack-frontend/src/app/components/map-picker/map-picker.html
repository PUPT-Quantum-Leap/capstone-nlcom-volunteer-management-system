<div class="map-picker-wrapper">
  <!-- Search Bar -->
  <div class="map-search">
    <div class="search-input-group">
      <input
        type="text"
        [(ngModel)]="searchQuery"
        (keyup.enter)="searchPlace()"
        placeholder="Search for a place..."
        class="map-search-input"
      />
      <button type="button" class="map-search-btn" (click)="searchPlace()" [disabled]="isSearching()">
        @if (isSearching()) {
          <span class="spinner-sm"></span>
        } @else {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
        }
      </button>
    </div>

    <!-- Search Results Dropdown -->
    @if (searchResults().length > 0) {
      <ul class="search-results">
        @for (result of searchResults(); track result.display_name) {
          <li (click)="selectResult(result)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
              <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
              <circle cx="12" cy="10" r="3"/>
            </svg>
            <span>{{ result.display_name }}</span>
          </li>
        }
      </ul>
    }
  </div>

  <!-- Map Container -->
  <div #mapContainer class="map-container"></div>

  <!-- Selected Location Display -->
  @if (selectedAddress()) {
    <div class="selected-location">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
        <circle cx="12" cy="10" r="3"/>
      </svg>
      <span class="selected-address">{{ selectedAddress() }}</span>
    </div>
  }

  <p class="map-hint">Click on the map or drag the marker to pinpoint the event location</p>
</div>

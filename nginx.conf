# Nginx Reverse Proxy Configuration for ServeTrack
# Serves Angular frontend + proxies /api to Laravel backend
# SSL termination + SPA routing

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 301 https://$host$request_uri;
}

# HTTPS server with SSL
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    # SSL certificates (mounted from host via docker-compose volume)
    ssl_certificate /etc/letsencrypt/live/servetrack.kaelvxdev.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/servetrack.kaelvxdev.space/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Serve frontend (Angular SPA from /usr/share/nginx/html)
    root /usr/share/nginx/html;
    index index.html;

    # Client max upload size
    client_max_body_size 25M;

    # SPA routing: all unknown routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;

        # Don't cache index.html
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        }

        # Cache static assets (have hash in filename)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|woff|woff2|ttf|svg)$ {
            expires 1y;
            add_header Cache-Control "public, immutable" always;
        }
    }

    # API proxy to Laravel backend (PHP-FPM on internal network)
    location /api/ {
        proxy_pass http://backend:9000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_redirect off;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Sanctum CSRF cookie endpoint (for SPA authentication)
    location /sanctum/ {
        proxy_pass http://backend:9000/sanctum/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Broadcasting endpoint (if using Laravel broadcasting)
    location /broadcasting/ {
        proxy_pass http://backend:9000/broadcasting/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health endpoint
    location = /up {
        proxy_pass http://backend:9000/up;
        access_log off;
    }

    # Deny access to dotfiles (except .well-known for SSL renewal)
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Allow .well-known for Certbot validation
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
}

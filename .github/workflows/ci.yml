name: ServeTrack CI Testing Workflow (Angular + Laravel)

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v6

      - name: Detect changed folders
        id: filter
        uses: dorny/paths-filter@v3
        with:
          base: ${{ github.event.repository.default_branch || 'main' }}
          filters: |
            frontend:
              - 'servetrack-frontend/**'
            backend:
              - 'servetrack-backend/**'

  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
      - name: Dependency Review
        uses: actions/dependency-review-action@v4

  # Frontend (Angular 21 + Vitest)
  frontend-check:
    runs-on: ubuntu-latest
    needs: check-changes
    if: needs.check-changes.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: servetrack-frontend
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: servetrack-frontend/package-lock.json

      - name: Install Chrome dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser
        working-directory: .

      - name: Install dependencies
        run: npm ci

      - name: Build Angular app
        run: npm run build --if-present

      - name: Run tests with coverage
        run: npm test -- --run --coverage
        env:
          CI: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: frontend-test-results
          path: servetrack-frontend/coverage/
          retention-days: 7

  # Backend (Laravel 12 w/ Pest)
  backend-check:
    runs-on: ubuntu-latest
    needs: check-changes
    if: needs.check-changes.outputs.backend == 'true'
    defaults:
      run:
        working-directory: servetrack-backend

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: servetrack_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, dom, filter, gd, json, mbstring, pdo, zip
          coverage: xdebug
          tools: composer:v2

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('servetrack-backend/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader --no-interaction

      - name: Setup Node.js for frontend assets
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: servetrack-backend/package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan config:clear
          php artisan cache:clear
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: servetrack_test
          DB_USERNAME: root
          DB_PASSWORD: root

      - name: Set up test database
        run: |
          php artisan config:cache
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: servetrack_test
          DB_USERNAME: root
          DB_PASSWORD: root

      - name: Run database migrations
        run: php artisan migrate --force
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: servetrack_test
          DB_USERNAME: root
          DB_PASSWORD: root

      - name: Run Laravel Pint
        run: vendor/bin/pint --test

      - name: Run tests with Pest
        run: php artisan test --coverage --min=80
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: servetrack_test
          DB_USERNAME: root
          DB_PASSWORD: root

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: backend-test-results
          path: |
            servetrack-backend/coverage/
            servetrack-backend/tests/
          retention-days: 7

  # Summary job - ensures all checks pass
  ci-success:
    runs-on: ubuntu-latest
    needs: [check-changes, frontend-check, backend-check]
    if: always()
    steps:
      - name: Check all jobs
        run: |
          if [[ "${{ needs.frontend-check.result }}" == "failure" ]] || [[ "${{ needs.backend-check.result }}" == "failure" ]]; then
            echo "❌ One or more jobs failed"
            exit 1
          elif [[ "${{ needs.frontend-check.result }}" == "skipped" ]] && [[ "${{ needs.backend-check.result }}" == "skipped" ]]; then
            echo "⏭️  No code changes detected - skipping CI"
          else
            echo "✅ All checks passed!"
          fi

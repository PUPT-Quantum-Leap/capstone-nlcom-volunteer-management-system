name: ServeTrack CD Deployment Workflow

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: servetrack-cd
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      VPS_PORT: ${{ secrets.VPS_SSH_PORT || '22' }}

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4

      - name: Setup Node.js (frontend)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: servetrack-frontend/package-lock.json

      - name: Setup PHP (backend)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, zip, bcmath, curl
          coverage: none

      - name: Get Composer Cache Directory
        id: composer-cache
        working-directory: servetrack-backend
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('servetrack-backend/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Build Frontend
        working-directory: servetrack-frontend
        run: |
          npm ci
          npm run build --configuration=production

      - name: Install Backend Dependencies
        working-directory: servetrack-backend
        run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader

      - name: Package Artifacts
        run: |
          set -e
          mkdir -p staging/frontend/public
          mkdir -p staging/backend
          mkdir -p staging/config
          mkdir -p staging/scripts
          
          # Find the directory containing index.html in the dist folder
          FRONTEND_DIST_DIR=$(find servetrack-frontend/dist -name "index.html" -exec dirname {} \; | head -n 1)
          if [ -z "$FRONTEND_DIST_DIR" ]; then
            echo "ERROR: index.html not found in frontend build."
            exit 1
          fi
          
          # Copy frontend to a unified public structure
          cp -R "$FRONTEND_DIST_DIR"/* staging/frontend/public/
          
          # Copy backend, excluding dev and source control
          rsync -a --exclude 'tests' \
                   --exclude 'node_modules' \
                   --exclude '.git' \
                   --exclude 'storage/framework/cache/data/*' \
                   --exclude 'storage/framework/views/*' \
                   --exclude 'storage/framework/sessions/*' \
                   --exclude 'storage/logs/*' \
                   servetrack-backend/ staging/backend/
          
          cp -R config/* staging/config/
          cp -R scripts/* staging/scripts/
          
          # Compress to a single archive
          cd staging
          tar -czf ../build.tar.gz .
          cd ..
          
          # Verify the archive was created
          ls -lh build.tar.gz

      - name: Transfer Archive to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ env.VPS_PORT }}
          source: "build.tar.gz"
          target: "/tmp/"
          overwrite: true

      - name: Execute Atomic Deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ env.VPS_PORT }}
          script: |
            # Extract the deploy script from the tarball temporarily
            tar -xzf /tmp/build.tar.gz -C /tmp scripts/deploy.sh
            # Make deploy.sh executable and run it
            sudo chmod +x /tmp/scripts/deploy.sh
            sudo /tmp/scripts/deploy.sh
